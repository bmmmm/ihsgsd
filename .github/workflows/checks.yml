name: Checks

# The repo's own gates, run on every push and pull request. Until this existed
# they only ever ran when somebody remembered to run them by hand, which is the
# same as not having them: the JS and Python copies of the Grundpreis logic and
# the diet/topic detectors can drift apart without a single error anywhere, and
# a drifted detector just quietly stops matching. test_parity.py is the only
# thing that sees that, so it has to run unattended.
#
# The data commits the fetch workflows push do NOT arrive here through the push
# trigger: GitHub does not start a workflow run for a push made with the
# built-in GITHUB_TOKEN, which is exactly how those workflows push. That is why
# the fetch workflows call this one explicitly as a second job — and why they
# pass the SHA they just pushed. A called workflow's checkout otherwise pins to
# github.sha, which for a scheduled run is the tip from *before* the data
# commit, so the audit would gate last week's snapshot and report green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out. Empty = the SHA that triggered the run."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Keyed on what is actually being checked, not on the caller's ref: all three
  # fetch workflows call this from refs/heads/main, so grouping on github.ref
  # would let them cancel each other — and a human push — mid-run.
  group: checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # No dependencies to install: the site is vanilla JS and the scripts are
      # stdlib-only Python. python3 and node are preinstalled on ubuntu-latest,
      # and test_parity.py shells out to node itself.
      - name: Show tool versions
        run: |
          python3 --version
          node --version

      - name: JS syntax
        # Every script must parse on its own. scripts/ is included because a
        # broken layout-probe.js would otherwise only surface by pasting it
        # into a browser console.
        run: |
          for f in *.js scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: JS page bundles
        # The step above cannot see the failure mode CLAUDE.md warns about:
        # node --check reads one file at a time, so two `const X` in two files
        # each pass alone and only collide when a page loads both. This one
        # concatenates each page's scripts in document order and parses that.
        run: python3 scripts/check_js_bundles.py

      - name: JS/Python parity
        # The full run, never --quick: --quick reads only the newest week and
        # provably misses detector drift, which is the thing this guards.
        run: python3 scripts/test_parity.py

      - name: Data audit
        # Non-zero exit means something new and fixable in the archives.
        run: python3 scripts/audit_data.py

      - name: weekly_sync Phase B recovery
        # Guards the one branch of the unattended sync job that would otherwise
        # lock it out of every later run. See the script's own header.
        run: bash scripts/test_sync_recovery.sh

      - name: Indexes are reproducible
        # build_indexes.py writes folder-structure.json, trend-index.json and
        # price-history-index.json. Regenerating them from the committed data
        # must produce exactly what is committed — a diff here means the
        # indexes and the snapshots have fallen out of step, which is invisible
        # in the browser until a badge or a week silently disappears.
        run: |
          python3 scripts/build_indexes.py
          git diff --exit-code -- data/folder-structure.json data/trend-index.json data/price-history-index.json
