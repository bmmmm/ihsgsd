name: Fetch EDEKA Offers

on:
  schedule:
    # EDEKA publishes the new week's flyer on Sunday (seen live at 11:04), so
    # the week is fetched Sunday midday and again Sunday evening, with the
    # Monday run kept as a safety net. Times are UTC; GitHub's scheduler is
    # routinely 30 min to 3 h late (the 05:00 Monday run fired at 08:33 on
    # 2026-07-27), which is precisely why there are three attempts.
    #
    # Running before the offers are valid is harmless: the snapshot is filed
    # under the API's own validFrom, so a Sunday run that still sees the old
    # week writes nothing new (see "Determine folder and file structure").
    - cron: "0 10 * * 0" # Sunday 12:00 CEST
    - cron: "0 16 * * 0" # Sunday 18:00 CEST
    - cron: "0 5 * * 1"  # Monday 07:00 CEST — safety net
  workflow_dispatch: # Allows manual triggering of the workflow

# The built-in GITHUB_TOKEN needs write access to push the fetched data back
# to the repo. This replaces the custom PAT (secrets.ABUFS_AJUN13_TOKEN), which
# expired and broke the pipeline; the built-in token never expires.
permissions:
  contents: write

concurrency:
  group: fetch-offers
  cancel-in-progress: false

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "24591225+bmmmm@users.noreply.github.com"

      - name: Fetch data from EDEKA API
        id: fetch-data
        run: |
          API_URL="https://www.edeka.de/api/auth-proxy/?path=api%2Foffers%3Flimit%3D999%26marketId%3D5625811"
          # Cron only runs once a week, so a transient hiccup (network blip or
          # the API briefly returning garbage) must not lose the whole week's
          # data. Retry both failure modes with increasing backoff before
          # finally giving up.
          SLEEPS=(30 120 300)
          for attempt in 1 2 3 4; do
            if ! RESPONSE=$(curl -sf "$API_URL"); then
              echo "EDEKA API fetch failed (HTTP error or network failure) on attempt $attempt/4"
            elif ! echo "$RESPONSE" | jq -e '.offers | type == "array"' >/dev/null; then
              echo "EDEKA API returned no offers array on attempt $attempt/4"
            else
              echo "$RESPONSE" > data.json
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              SLEEP="${SLEEPS[$((attempt - 1))]}"
              echo "Retrying in ${SLEEP}s..."
              sleep "$SLEEP"
            fi
          done
          echo "EDEKA API fetch failed after 4 attempts, giving up"
          exit 1

      - name: Sort JSON by category
        run: |
          RAW_JSON=$(cat data.json)
          SORTED_JSON=$(echo "$RAW_JSON" | jq '.offers |= sort_by(.category.name)')
          echo "$SORTED_JSON" > data.json

      - name: Determine folder and file structure
        id: structure
        env:
          # Strips the two parts EDEKA varies per request, so two fetches of the
          # same week can be compared for actual content changes.
          NORMALISE: '.offers |= map(del(.images) | .criteria = ((.criteria // []) | sort_by(.id)))'
        run: |
          # File the snapshot by the API's own validFrom (the Monday the offers
          # start), NOT by the run date. That makes the destination a property of
          # the data instead of the clock, which is what allows a Sunday fetch:
          # if EDEKA has already switched, the offers land under next week; if it
          # has not, they land on the existing file for the current week and the
          # run ends up committing nothing. Falls back to the run date if the
          # field is ever missing.
          VALID_FROM=$(jq -r '.validFrom // empty' data.json)
          if [ -n "$VALID_FROM" ] && date -u -d "$VALID_FROM" +%s >/dev/null 2>&1; then
            REF_DATE="$VALID_FROM"
          else
            REF_DATE=$(date -u +"%Y-%m-%d")
            echo "WARN: no usable validFrom in the response, falling back to $REF_DATE"
          fi
          # Calendar year (%Y) so the folder year matches the filename's own year.
          # %G (ISO week-numbering year) diverges at the Dec/Jan boundary — e.g.
          # 2025-12-29 would land under data/2026/ while every existing snapshot
          # uses calendar-year folders, and the dropdown label would show the
          # wrong year.
          YEAR=$(date -u -d "$REF_DATE" +"%Y")
          WEEK="KW$(date -u -d "$REF_DATE" +"%V")"
          FOLDER="data/$YEAR/$WEEK"
          FILE="$FOLDER/$REF_DATE.json"
          mkdir -p "$FOLDER"

          # Two guards against pointless rewrites, now that three runs a week hit
          # the same week's file.
          if [ -f "$FILE" ]; then
            OLD=$(jq '.offers | length' "$FILE")
            NEW=$(jq '.offers | length' data.json)
            # 1. Never shrink an archived week. A fetch catching EDEKA mid-switch
            #    returns a partial list; overwriting a complete snapshot with it
            #    would lose those offers for good.
            if [ "$NEW" -lt "$OLD" ]; then
              echo "Existing $FILE has $OLD offers, fetched only $NEW — keeping the existing snapshot."
              rm -f data.json
              echo "folder=$FOLDER" >> $GITHUB_OUTPUT
              echo "file=$FILE" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 2. Ignore EDEKA's per-request churn. Every response mints fresh
            #    UUIDs for all four image URLs and returns `criteria` in
            #    arbitrary order, so re-fetching an unchanged week still differs
            #    in ~800 lines. Left alone that is three noise commits a week.
            #    Dropping the image URLs is safe: thumbnails are archived under
            #    img/ and the page prefers those, falling back to the live URL.
            if [ "$(jq -S "$NORMALISE" "$FILE")" = "$(jq -S "$NORMALISE" data.json)" ]; then
              echo "$FILE is unchanged apart from image URLs and criteria order — keeping it."
              rm -f data.json
              echo "folder=$FOLDER" >> $GITHUB_OUTPUT
              echo "file=$FILE" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          mv data.json "$FILE"
          echo "folder=$FOLDER" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Archive product images
        run: |
          # Download the small `app` thumbnails (~10 KB each) into a sibling
          # img/ dir so they survive EDEKA's ~1-2 month purge of live images.
          # Keyed by offer id; skips already-present files; failures are
          # non-fatal (the frontend falls back to the live URL).
          IMG_DIR="${{ steps.structure.outputs.folder }}/img"
          FILE="${{ steps.structure.outputs.file }}"
          mkdir -p "$IMG_DIR"
          ok=0; fail=0
          while IFS=$'\t' read -r id url; do
            [ -n "$url" ] || continue
            out="$IMG_DIR/${id}.jpg"
            [ -f "$out" ] && continue
            if curl -sf --max-time 30 -o "$out" "$url"; then
              ok=$((ok + 1))
            else
              rm -f "$out"; fail=$((fail + 1))
              echo "WARN: could not fetch image for offer $id ($url)"
            fi
            sleep 0.1  # gentle throttle so we don't hammer the image host
          done < <(jq -r '.offers[] | "\(.id)\t\(.images.app // "")"' "$FILE")
          echo "Archived $ok image(s), $fail failure(s) into $IMG_DIR"

      - name: Generate folder-structure.json
        id: generate-structure
        run: |
          # Only the nested weekly snapshots (data/<year>/KW<nn>/<date>.json) —
          # a path filter, not an exclusion list, so root-level generated
          # artifacts (folder-structure/trend-index/price-history/insights/
          # prospekt and any future one) can never leak into the week dropdown.
          find data -type f -name "*.json" -path "data/*/KW*/*.json" | sed 's|^data/||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))' > data/folder-structure.json

      - name: Generate index files (trend + price history)
        id: generate-indexes
        run: |
          # One Python pass over all snapshots produces both precomputed indexes
          # the dashboard loads instead of the ~17 MB of weekly JSON:
          #   - trend-index.json         per-week category counts + KPIs
          #   - price-history-index.json per-product Grundpreis (€/unit) series
          # stdlib only; python3 is preinstalled on ubuntu-latest.
          python3 scripts/build_indexes.py

      - name: Commit and push data
        run: |
          git add data/
          git diff --staged --quiet && echo "Nothing to commit, skipping" && exit 0
          git commit -m "Add data for ${{ steps.structure.outputs.file }} and update folder structure"
          # Retry against a concurrent push to main: a commit landing between the
          # checkout and this push makes git push a non-fast-forward and would
          # abort the run, losing the fetched week. Rebase onto the latest remote
          # and try again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts" >&2
          exit 1
